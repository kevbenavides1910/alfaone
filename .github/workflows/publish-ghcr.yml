# Publica imagen Docker a GHCR para deploy rápido en el VPS (ops:deploy:ghcr).
# Corre en self-hosted alfaia-229 (48 cores). Usa driver docker para reutilizar
# capas locales entre builds (mucho más rápido que ubuntu-latest + cache registry).
name: Publish GHCR

on:
  push:
    branches: [main, master]
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "next.config.ts"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "scripts/fe-xades-bootstrap.cjs"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kevbenavides1910/alfaone

jobs:
  publish:
    name: Build y push imagen
    runs-on: [self-hosted, linux, x64, alfaia]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # driver: docker → capas quedan en el daemon local del VPS (cache real entre runs)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Sin cache-to registry (mode=max): en el 1er run subía GB y sumaba ~10+ min.
          # Con driver docker: capas deps/ora/apt + cache mount /.next/cache entre runs.
          # DOCKER_BUILD=1 omite typecheck en next build (~60s); CI sigue tipando.
