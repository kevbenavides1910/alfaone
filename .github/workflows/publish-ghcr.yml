# Publica imagen Docker a GHCR para deploy rápido en el VPS (ops:deploy:ghcr).
# Corre en self-hosted alfaia (48 cores). Usa driver docker para reutilizar
# capas locales entre builds (mucho más rápido que ubuntu-latest + cache registry).
#
# Build y push van en pasos separados: la imagen queda etiquetada en el daemon
# local al terminar el build → ops:deploy:ghcr puede recrear la app sin esperar
# a que termine el push a ghcr.io (~20–40s ahorrados en el wait típico).
name: Publish GHCR

on:
  push:
    branches: [main, master]
    # Sin paths filter: pushes a main siempre publican.
    # Antes, paths + flakiness de Actions/webhooks + cancel-in-progress dejaban
    # commits sin imagen (agentes tenían que hacer workflow_dispatch a mano).
  workflow_dispatch:

concurrency:
  # false: evita pelear con cancel API (502) que dejaba jobs zombie "in_progress"
  # bloqueando el runner (busy) mientras nuevos runs quedaban queued eternamente.
  # Un solo self-hosted → los publishes se encolan en serie de forma natural.
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kevbenavides1910/alfaone

jobs:
  publish:
    name: Build y push imagen
    runs-on: [self-hosted, linux, x64, alfaia]
    # Evita jobs colgados tras restart del runner / BadGateway de Actions.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # driver: docker → capas quedan en el daemon local del VPS (cache real entre runs)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      # 1) Build + load local (deploy wait encuentra la imagen aquí, antes del push).
      - name: Build imagen (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Sin cache-to registry (mode=max): en el 1er run subía GB y sumaba ~10+ min.
          # Con driver docker: capas deps/ora/apt + cache mount /.next/cache entre runs.
          # DOCKER_BUILD=1 omite typecheck en next build (~60s); CI sigue tipando.

      # 2) Deploy automático + Push a GHCR en paralelo.
      # El deploy usa la imagen YA local (load:true) sobre el checkout de producción
      # y NO espera el push a ghcr.io. El push corre en background; si falla el
      # deploy, el push igual continúa (la imagen es el artefacto canónico).
      - name: Deploy automático + push GHCR en paralelo
        run: |
          set -uo pipefail
          # Lanzar push a GHCR en background
          (
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "→ docker push $tag"
              docker push "$tag"
            done <<< "${{ steps.meta.outputs.tags }}"
          ) > /tmp/ghcr-push.log 2>&1 &
          PUSH_PID=$!

          # Deploy en el checkout de producción (tiene .env.production y compose)
          cd /mnt/data/projects/alfa-one/code/presupuestos-alfa
          # El checkout de producción debe estar en el SHA del build. Si no, traer
          # solo los scripts de deploy actualizados (sin tocar cambios locales ajenos).
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "checkout producción en $CURRENT_SHA, trayendo scripts del SHA ${{ github.sha }}"
            git fetch origin main --quiet 2>/dev/null || true
            git checkout --quiet "${{ github.sha }}" -- scripts/ prisma/ 2>/dev/null || true
          fi
          APP_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}" bash scripts/deploy-from-image.sh

          # Esperar el push a GHCR y fallar el job solo si el push falla
          wait "$PUSH_PID" || { echo "ERROR: push GHCR falló"; tail -20 /tmp/ghcr-push.log; exit 1; }
