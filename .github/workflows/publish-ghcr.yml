# Publica imagen Docker a GHCR para deploy rápido en el VPS (ops:deploy:ghcr).
# Corre en self-hosted alfaia-229 (48 cores) — mucho más rápido que ubuntu-latest (2 cores).
name: Publish GHCR

on:
  push:
    branches: [main, master]
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "next.config.ts"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "scripts/fe-xades-bootstrap.cjs"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kevbenavides1910/alfaone
  CACHE_IMAGE: ghcr.io/kevbenavides1910/alfaone:buildcache

jobs:
  publish:
    name: Build y push imagen
    runs-on: [self-hosted, linux, x64, alfaia]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache en GHCR (persiste entre runs del self-hosted mejor que solo GHA)
          cache-from: |
            type=registry,ref=${{ env.CACHE_IMAGE }}
            type=gha
          cache-to: |
            type=registry,ref=${{ env.CACHE_IMAGE }},mode=max
            type=gha,mode=max
          provenance: false
          # Aprovechar CPU del host (buildkit)
          build-args: |
            BUILDKIT_INLINE_CACHE=1
