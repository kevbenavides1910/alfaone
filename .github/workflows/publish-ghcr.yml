# Publica imagen Docker a GHCR para deploy rápido en el VPS (ops:deploy:ghcr).
# Corre en self-hosted alfaia (48 cores). Usa driver docker para reutilizar
# capas locales entre builds (mucho más rápido que ubuntu-latest + cache registry).
#
# Cache webpack: BuildKit mount id=alfaone-next-cache (sin COPY 1.4G).
# Opcional legado: ALFAONE_USE_DISK_CACHE=1.
#
# Build y push van en pasos separados: la imagen queda etiquetada en el daemon
# local al terminar el build → ops:deploy:ghcr puede recrear la app sin esperar
# a que termine el push a ghcr.io (~20–40s ahorrados en el wait típico).
name: Publish GHCR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".cursor/**"
      - ".deploy-logs/**"
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kevbenavides1910/alfaone

jobs:
  publish:
    name: Build y push imagen
    runs-on: [self-hosted, linux, x64, alfaia]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar cache webpack (opcional, legado)
        if: env.ALFAONE_USE_DISK_CACHE == '1'
        run: bash scripts/ops/sync-build-cache.sh pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: ¿Imagen ya construida para este SHA?
        id: image_exists
        run: |
          if docker image inspect "${{ env.IMAGE_NAME }}:${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SKIP build: imagen local ya existe para ${{ github.sha }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build imagen (local)
        id: build
        if: steps.image_exists.outputs.exists != 'true'
        run: |
          START=$(date +%s)
          DEPLOY_GHCR_PUSH=0 bash scripts/ops/build-ghcr-image-local.sh
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Re-etiquetar imagen existente
        if: steps.image_exists.outputs.exists == 'true'
        run: |
          SRC="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$SRC" "$tag"
            echo "tagged $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Tiempos de build
        run: |
          if [ "${{ steps.image_exists.outputs.exists }}" = "true" ]; then
            echo "docker_build=skipped (imagen ya local)"
          else
            echo "docker_build_seconds=${{ steps.build.outputs.duration }}"
          fi

      - name: Deploy automático + push GHCR en paralelo
        run: |
          set -uo pipefail
          (
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "→ docker push $tag"
              docker push "$tag"
            done <<< "${{ steps.meta.outputs.tags }}"
          ) > /tmp/ghcr-push.log 2>&1 &
          PUSH_PID=$!

          cd /mnt/data/projects/alfa-one/code/presupuestos-alfa
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "checkout producción en $CURRENT_SHA, trayendo scripts del SHA ${{ github.sha }}"
            git fetch origin main --quiet 2>/dev/null || true
            git checkout --quiet "${{ github.sha }}" -- scripts/ prisma/ 2>/dev/null || true
          fi
          deploy_rc=0
          APP_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            DEPLOY_SKIP_DB_BACKUP=1 \
            DEPLOY_FAST_SMOKE=1 \
            bash scripts/deploy-from-image.sh || deploy_rc=$?
          if [ "$deploy_rc" -ne 0 ]; then
            echo "::warning::Deploy automático no completó (rc=$deploy_rc). Suele ser lock concurrente; build/push siguen."
          fi

          wait "$PUSH_PID" || { echo "ERROR: push GHCR falló"; tail -20 /tmp/ghcr-push.log; exit 1; }
