# Ejemplo: reverse proxy con TLS delante de security_contracts_app (:3000)
# Copiar a /etc/nginx/sites-available/presupuestos-alfa y ajustar server_name y certificados.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 443 ssl http2;
    server_name presupuestos.ejemplo.local;

    ssl_certificate     /etc/ssl/certs/presupuestos.crt;
    ssl_certificate_key /etc/ssl/private/presupuestos.key;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name presupuestos.ejemplo.local;
    return 301 https://$host$request_uri;
}
