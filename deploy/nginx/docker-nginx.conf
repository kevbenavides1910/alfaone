worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 64m;

  upstream presupuestos_app {
    server app:3000;
  }

  # Puerto 80 — la app expone 3000 directamente; nginx no debe competir por ese puerto en el host.
  server {
    listen 80;
    server_name _;
    large_client_header_buffers 8 64k;

    location / {
      proxy_pass http://presupuestos_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
      # NextAuth JWT con permisos puede superar el buffer por defecto (~4k)
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }
  }
}
