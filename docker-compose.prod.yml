# Configuración para VPS con datos en /mnt/data
services:
  postgres:
    image: postgres:16-alpine
    container_name: alfa_one_db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - /mnt/data/volumes/postgres/alfa-one_postgres_data/_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfa_one_app
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env.production
    environment:
      # No interpolar secretos desde .env del host; todo viene de .env.production
      TZ: ${TZ:-America/Costa_Rica}
      NODE_ENV: production
      APP_DATA_ROOT: /data
      EXPENSE_UPLOAD_DIR: /data/expense-uploads
      BRANDING_UPLOAD_DIR: /data/branding
    volumes:
      - ${APP_DATA_HOST:-/mnt/data/projects/alfa-one/app}:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Proxy: la app no publica el puerto 3000 directamente al host
  nginx:
    image: nginx:1.27-alpine
    container_name: alfa_one_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./deploy/nginx/docker-nginx.conf:/etc/nginx/nginx.conf:ro

