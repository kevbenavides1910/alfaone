# Uso en el VPS (p. ej. Contabo): cree .env.production y despliegue:
#   npm run ops:deploy:auto   # preferido: pull GHCR si hay imagen del SHA
#   npm run ops:deploy:pull   # imagen GHCR (rápido)
#   npm run ops:deploy        # build local (WIP / dirty tree)
#
# Al arrancar, el contenedor app ejecuta `prisma migrate deploy` (tabla companies, etc.).
# Si la base ya tenía datos pero nunca migraciones Prisma, puede fallar con P3005:
#   aplique el SQL de prisma/migrations/... manualmente y marque la migración como aplicada, o use baseline.
#
# PostgreSQL solo escucha en la red interna de Docker (no expone 5432 al exterior).
# La app escucha en 0.0.0.0:3000 — ponga Nginx/Caddy delante con HTTPS o restrinja el firewall.
#
# Archivos (PDF, imágenes, etc.): disco grande en APP_DATA_HOST — docs/STORAGE.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: security_contracts_db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Por defecto construye local. Para deploy rápido desde GHCR:
    #   APP_IMAGE=ghcr.io/kevbenavides1910/alfaone:latest npm run ops:deploy:pull
    image: ${APP_IMAGE:-presupuestos-alfa-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security_contracts_app
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TZ: ${TZ:-America/Costa_Rica}
      NODE_ENV: production
      APP_DATA_ROOT: /data
      EXPENSE_UPLOAD_DIR: /data/expense-uploads
      BRANDING_UPLOAD_DIR: /data/branding
      NAF_ORACLE_CLIENT_DIR: /opt/oracle/instantclient_19_23
      EXPEDIENTE_SMB_SHARE: ${EXPEDIENTE_SMB_SHARE:-//10.1.1.6/Expediente Digital}
      EXPEDIENTE_SMB_USER: ${EXPEDIENTE_SMB_USER:-oracle}
      EXPEDIENTE_SMB_PASSWORD: ${EXPEDIENTE_SMB_PASSWORD:-}
      EXPEDIENTE_FS_ROOT: ${EXPEDIENTE_FS_ROOT:-}
      LD_LIBRARY_PATH: /opt/oracle/instantclient_19_23
      FRAPPE_BASE_URL: ${FRAPPE_BASE_URL:-}
      FRAPPE_API_KEY: ${FRAPPE_API_KEY:-}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET:-}
      FRAPPE_COMPANY: ${FRAPPE_COMPANY:-Grupo Alfa}
      SYNTRA_AI_ENABLED: ${SYNTRA_AI_ENABLED:-true}
      SYNTRA_AI_PROVIDER: ${SYNTRA_AI_PROVIDER:-}
      SYNTRA_AI_API_KEY: ${SYNTRA_AI_API_KEY:-}
      SYNTRA_AI_BASE_URL: ${SYNTRA_AI_BASE_URL:-}
      SYNTRA_AI_MODEL: ${SYNTRA_AI_MODEL:-}
    volumes:
      - ${APP_DATA_HOST:-/mnt/storage/apps/presupuestos-alfa}:/data
      - /opt/oracle/instantclient_19_23:/opt/oracle/instantclient_19_23:ro
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production

  nginx:
    image: nginx:1.27-alpine
    container_name: security_contracts_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/docker-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
